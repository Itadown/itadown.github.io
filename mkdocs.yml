site_name: Itadown CTF Writeups

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
  icon:
    tag:
      default: fontawesome/solid/computer
      reverse: material/bug
      pwn: fontawesome/solid/square-binary
      forensics: simple/searxng
      crypto: material/math-integral
      mobile: fontawesome/solid/mobile-phone
      web: material/firefox
      network: material/web
      stegano: material/image
      osint: material/map
      ai: material/robot-outline
      hardware: simple/opensourcehardware
      log: octicons/log-16
      inci: material/shield-alert
      soc: material/monitor-dashboard
      priv: material/account-key

plugins:
  - search
  - tags

extra:
  tags:
    Reverse Engineering: reverse
    Binary Exploitation: pwn
    Forensics: forensics
    Cryptography: crypto
    Mobile: mobile
    Web: web
    Network: network
    Steganography: stegano
    OSINT: osint
    AI: ai
    Hardware: hardware
    Log Analysis: log
    Incident Response: inci
    SOC: soc
    Privilege Escalation: priv
