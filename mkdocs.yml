site_name: Itadown CTF Writeups

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode

plugins:
  - search
  - tags:
      custom_dir: docs/

nav:
  - Accueil: index.md
  - CTF Categories: categories.md
  - My CTFs:
      - ByteMe CTF 2026: byteme_ctf_2026/
      - Root-Me Pro X DGSE CTF 2025: root-me-pro_x_dgse_ctf_2025/
      - Securinets CTF Quals 2026: securinets_ctf_quals_2026/
