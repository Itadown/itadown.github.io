site_name: Itadown CTF Writeups

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
  icon:
    tag:
      default: fontawesome/solid/computer
      00: simple/assemblyscript
      "Binary Exploitation": fontawesome/solid/square-binary
      "Forensics": simple/searxng
      "Cryptography": material/math-integral
      "Mobile": fontawesome/solid/mobile-phone
      "Web": material/firefox
      "Network": material/web
      "Steganography": 
      "OSINT": material/map
      "AI": fontawesome/brands/openai
      "Hardware": simple/opensourcehardware

plugins:
  - search
  - tags

extra:
  tags:
    Reverse Engineering: 00
    Binary Exploitation: 01
    Forensics: 02
    Cryptography: 03
    Mobile: 04
    Web: 05
    Network: 06
    Steganography: 07
    OSINT: 08
    AI: 09
    Hardware: 10

